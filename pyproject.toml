[project]
name = "anki-mining-backfill"
version = "0.1.0-audit1"
description = "Anki add-on: backfills mining cards from their enriched scene siblings"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["normalize.py", "fieldconfig.py", "matching.py", "plan.py", "report.py", "scripts", "tests"]
